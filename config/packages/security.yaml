security:
  password_hashers:
    App\Entity\Utilisateur: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Entity\Utilisateur
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider

      form_login:
        login_path: app_login
        check_path: app_login

      logout:
        path: app_logout

      remember_me:
        secret: '%kernel.secret%'
        lifetime: 604800
        path: /

  # access_control:
